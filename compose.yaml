# Development infrastructure only: a container for the checks and a local trace viewer. Neither is
# the execution host of the architecture in docs/TCA_ARCHITECTURAL_FOUNDATIONS.md.
services:
  dev:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    env_file:
      - path: .env
        required: false
    environment:
      OTEL_SERVICE_NAME: tca
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
    volumes:
      - .:/workspace
    init: true
    depends_on:
      - jaeger

  jaeger:
    image: jaegertracing/jaeger:2.14.0@sha256:7da6b6e878760315130de8799887ebff012efaa18af2e20112c07feddeda7d52
    ports:
      - "16686:16686"
