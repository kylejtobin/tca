name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --extra nats
      - run: uv run just check
      - run: uv run just audit

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker compose config --quiet
      - uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
      - run: uv build --package type-construction
      # The core imports without the NATS extra; the integration imports with it.
      - run: uv run --isolated --no-project --with dist/type_construction-*.whl python -c 'import type_construction.resources, type_construction.diagnostics'
      - run: uv run --isolated --no-project --with "type-construction[nats] @ $(ls dist/type_construction-*.whl)" python -c 'import type_construction.nats'
