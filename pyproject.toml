[project]
name = "tca-workspace"
version = "0.0.0"
description = "Workspace for the Type Construction Architecture packages."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/python/*"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "basedpyright",
    "import-linter",
    "opentelemetry-distro>=0.58b0",
    "opentelemetry-exporter-otlp-proto-http>=1.37",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "semgrep>=1.179.0",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["packages/python", "tests"]
asyncio_mode = "strict"
strict_config = true
strict_markers = true
xfail_strict = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["packages/python"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","A","C4","PIE","RET","SIM","ARG","PTH","ERA","PL","TRY","RUF","ANN","S","FBT","TC","EM"]
ignore = ["ANN401","TRY003","TC001","TC002","TC003"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S106", "ARG001", "PLR2004"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel","pydantic.RootModel"]

[tool.ruff.lint.isort]
known-first-party = ["type_construction"]

[tool.basedpyright]
include = ["packages/python", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.bandit]
targets = ["."]
exclude_dirs = [".venv", "venv", "tests", "build", "dist", "htmlcov", ".git"]
confidence = "LOW"
severity = "LOW"

[tool.importlinter]
root_packages = ["type_construction.agent", "type_construction.eval", "type_construction.registrar"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The registrar's domain imports nothing outside itself"
type = "forbidden"
source_modules = ["type_construction.registrar.domain"]
forbidden_modules = [
    "type_construction.registrar.integration",
    "type_construction.registrar.config",
    "httpx",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "The agent's domain imports nothing outside itself"
type = "forbidden"
source_modules = ["type_construction.agent.domain"]
forbidden_modules = [
    "type_construction.agent.integration",
    "type_construction.agent.config",
    "pydantic_ai",
    "pydantic_ai_harness",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "The eval's domain imports nothing outside itself"
type = "forbidden"
source_modules = ["type_construction.eval.domain"]
forbidden_modules = [
    "type_construction.agent",
    "type_construction.eval.integration",
    "type_construction.eval.config",
    "inspect_ai",
    "pydantic_ai",
    "opentelemetry",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "The eval's domain files import those above them"
type = "layers"
containers = ["type_construction.eval.domain.evaluation"]
layers = ["run", "dataset", "version", "value", "type"]

[[tool.importlinter.contracts]]
name = "The eval imports inward, file by file"
type = "layers"
containers = ["type_construction.eval"]
layers = ["config", "integration", "domain"]

[[tool.importlinter.contracts]]
name = "The eval's integrations import none of each other"
type = "independence"
modules = [
    "type_construction.eval.integration.record",
    "type_construction.eval.integration.subject",
]

[[tool.importlinter.contracts]]
name = "The eval's subject files import those above them"
type = "layers"
containers = ["type_construction.eval.integration.subject"]
layers = ["interpreter", "production", "provider", "model"]

[[tool.importlinter.contracts]]
name = "The eval's record files import those above them"
type = "layers"
containers = ["type_construction.eval.integration.record"]
layers = ["interpreter", "task | identity", "provider", "model"]

[[tool.importlinter.contracts]]
name = "The registrar imports inward, file by file"
type = "layers"
containers = ["type_construction.registrar"]
layers = ["config", "integration", "domain"]

[[tool.importlinter.contracts]]
name = "The registrar's domain files import those above them"
type = "layers"
containers = ["type_construction.registrar.domain.registration"]
layers = ["name", "value", "type"]

[[tool.importlinter.contracts]]
name = "The registrar's integration files import those above them"
type = "layers"
containers = ["type_construction.registrar.integration.registrar"]
layers = ["interpreter", "attempt | check | query", "provider", "model"]

[[tool.importlinter.contracts]]
name = "The agent imports inward, file by file"
type = "layers"
containers = ["type_construction.agent"]
layers = ["config", "integration", "domain"]

[[tool.importlinter.contracts]]
name = "The agent's domain files import those above them"
type = "layers"
containers = ["type_construction.agent.domain.agent"]
layers = ["exchange", "type"]

[[tool.importlinter.contracts]]
name = "The agent's integration files import those above them"
type = "layers"
containers = ["type_construction.agent.integration.pydantic_ai"]
layers = ["interpreter", "answered", "provider", "model"]
