[project]
name = "tca"
version = "0.1.0"
description = "Type Construction Architecture — programs as type construction graphs"
license = { text = "BSL" }
readme = "README.md"
requires-python = ">=3.12"
scripts = { tca = "app.main:main" }
dependencies = [
    "ast2json>=0.4",
    "claude-agent-sdk>=0.2.102",
    "fastmcp>=3.4.2",
    "mcp>=1.27.2",
    "nats-py>=2.15.0",
    "pycozo[embedded]>=0.7.6",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
exclude = ["*.mdx"]

[dependency-groups]
dev = [
    "basedpyright>=1.38.1",
    "pytest>=9.0.2",
    "types-pyyaml>=6.0.12.20260518",
]
