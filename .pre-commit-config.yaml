default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: check
        name: just check
        entry: uv run just check
        language: system
        pass_filenames: false
        always_run: true
      - id: audit
        name: just audit
        entry: uv run just audit
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock|Dockerfile|compose\.yaml|packages/.*(\.py|/pyproject\.toml))$
