repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: smell-check
        name: smell-check
        entry: .agents/skills/smell-check/smell-check
        language: script
        pass_filenames: false
        types: [python]
        args:
          - packages/python/tca-agent/src
          - packages/python/tca-eval/src

  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --no-fix --force-exclude
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --check --force-exclude
        language: system
        types: [python]
      - id: basedpyright
        name: basedpyright
        entry: uv run basedpyright
        language: system
        types: [python]
        pass_filenames: false
      - id: bandit
        name: bandit
        entry: uv run bandit -c pyproject.toml -r .
        language: system
        types: [python]
        pass_filenames: false
      - id: semgrep
        name: semgrep
        entry: uv run semgrep scan --config p/python --config p/secrets --error --quiet -j 1
        language: system
        types: [python]
        pass_filenames: false
      - id: pip-audit
        name: pip-audit
        entry: uv run pip-audit
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: uv-lock-check
        name: uv lock --check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
