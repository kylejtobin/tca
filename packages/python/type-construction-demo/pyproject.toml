[project]
name = "type-construction-demo"
version = "0.0.0"
description = "The TCA demo program: the shop, the public reference the tca-python-demo pages are copied from."
requires-python = ">=3.14"
license = "LicenseRef-BSD-3-Clause-Commons-Clause"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["tca", "type-construction-architecture", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "httpx>=0.28,<1",
    "type-construction-http",
    "type-construction-world",
]
import-names = ["type_construction.demo"]
import-namespaces = ["type_construction"]

[project.urls]
Homepage = "https://github.com/kylejtobin/tca"
Repository = "https://github.com/kylejtobin/tca"
Issues = "https://github.com/kylejtobin/tca/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "type_construction.demo"

[tool.uv.sources]
type-construction-http = { workspace = true }
type-construction-world = { workspace = true }
