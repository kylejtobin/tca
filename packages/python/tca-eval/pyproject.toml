[project]
name = "tca-eval"
version = "0.0.0"
description = "Automated evaluation of TCA development, modeled as TCA types."
requires-python = ">=3.14"
license = "LicenseRef-TCA-BSL-1.1"
license-files = ["LICENSE"]
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["tca", "type-construction-architecture", "pydantic", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["pydantic>=2.9,<3"]
import-names = ["tca.eval"]
import-namespaces = ["tca"]

[project.urls]
Homepage = "https://github.com/kylejtobin/tca"
Repository = "https://github.com/kylejtobin/tca"
Issues = "https://github.com/kylejtobin/tca/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "tca.eval"
source-include = ["tests/**"]
