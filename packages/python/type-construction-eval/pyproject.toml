[project]
name = "type-construction-eval"
version = "0.0.0"
description = "Automated evaluation of TCA development, modeled as TCA types."
requires-python = ">=3.14"
license = "LicenseRef-BSD-3-Clause-Commons-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["tca", "type-construction-architecture", "pydantic", "evaluation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "arize-phoenix-client>=3.5,<4",
    "inspect-ai>=0.3,<0.4",
    "opentelemetry-api>=1.37,<2",
    "opentelemetry-processor-baggage>=0.58b0,<0.59",
    "pydantic>=2.9,<3",
    "pydantic-ai-slim>=2.54,<3",
]
import-names = ["type_construction.eval"]
import-namespaces = ["type_construction"]

[project.urls]
Homepage = "https://github.com/kylejtobin/tca"
Repository = "https://github.com/kylejtobin/tca"
Issues = "https://github.com/kylejtobin/tca/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "type_construction.eval"
source-include = ["tests/**"]
