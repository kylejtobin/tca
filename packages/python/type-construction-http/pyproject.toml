[project]
name = "type-construction-http"
version = "0.0.0"
description = "Serves a TCA program's routes over HTTP: each request an arrival with a channel for its answer, through the engine's edge."
requires-python = ">=3.14"
license = "LicenseRef-BSD-3-Clause-Commons-Clause"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["tca", "type-construction-architecture", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "starlette>=1.7,<2",
    "type-construction",
    "uvicorn>=0.54,<1",
]
import-names = ["type_construction.http"]
import-namespaces = ["type_construction"]

[project.urls]
Homepage = "https://github.com/kylejtobin/tca"
Repository = "https://github.com/kylejtobin/tca"
Issues = "https://github.com/kylejtobin/tca/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "type_construction.http"

[tool.uv.sources]
type-construction = { workspace = true }
