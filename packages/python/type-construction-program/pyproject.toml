[project]
name = "type-construction-program"
version = "0.0.0"
description = "A declarative contract for durable business programs: typed relationships, a pure evaluator over recorded evidence, admission and an in-memory host."
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["tca", "type-construction-architecture", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.13,<3",
    "type-construction-world",
]
import-names = ["type_construction.program"]
import-namespaces = ["type_construction"]

[project.urls]
Homepage = "https://github.com/kylejtobin/tca"
Repository = "https://github.com/kylejtobin/tca"
Issues = "https://github.com/kylejtobin/tca/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "type_construction.program"

[tool.uv.sources]
type-construction-world = { workspace = true }
