[project]
name = "type-construction-cli"
version = "0.0.0"
description = "Runs a TCA program's route from the command line: arguments and standard input as the request, the reply on standard output."
requires-python = ">=3.14"
license = "LicenseRef-BSD-3-Clause-Commons-Clause"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Kyle Tobin", email = "tobin.kyle@gmail.com" }]
keywords = ["tca", "type-construction-architecture", "pydantic"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "type-construction-engine",
]
import-names = ["type_construction.cli"]
import-namespaces = ["type_construction"]

[project.urls]
Homepage = "https://github.com/kylejtobin/tca"
Repository = "https://github.com/kylejtobin/tca"
Issues = "https://github.com/kylejtobin/tca/issues"

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "type_construction.cli"

[tool.uv.sources]
type-construction-engine = { workspace = true }
